name: Deploy

on:
  push:
    branches: [main]
  # Prices live in codart-messaging: a daily build picks up a change there.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Until the site stack is applied and its outputs are set as repository variables.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The deploy role trusts only this environment of this repository.
    environment: production
    env:
      PLANS_API_URL: ${{ vars.PLANS_API_URL }}
      NUXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NUXT_PUBLIC_WHATSAPP_NUMBER }}
      NUXT_PUBLIC_GA_ID: ${{ vars.NUXT_PUBLIC_GA_ID }}
      NUXT_PUBLIC_META_PIXEL_ID: ${{ vars.NUXT_PUBLIC_META_PIXEL_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate
        run: pnpm generate

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # The CDN keeps a file five minutes when it carries no Cache-Control, so every file sets its
      # own. Hashed files go first and are never deleted here: a visitor holding the previous HTML
      # still finds what it asks for.
      - name: Upload the hashed assets
        run: |
          for dir in _nuxt _scripts; do
            [ -d ".output/public/$dir" ] || continue
            aws s3 sync ".output/public/$dir" "s3://${{ vars.SITE_BUCKET }}/$dir" \
              --cache-control "public, max-age=31536000, immutable"
          done

      - name: Upload the pages
        run: >
          aws s3 sync .output/public "s3://${{ vars.SITE_BUCKET }}"
          --exclude "_nuxt/*" --exclude "_scripts/*" --delete
          --cache-control "public, max-age=0, s-maxage=300, must-revalidate"

      - name: Refresh the pages at the edge
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}"
          --paths "/*"
